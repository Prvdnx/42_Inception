[www]
user = www-data
group = www-data

listen = 9000

listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no



# Configures the PHP-FPM pool named 'www', which will handle PHP requests for the WordPress site.
# Sets the process ownership to the www-data user and group, ensuring proper permissions for PHP-FPM processes.
# Configures PHP-FPM to listen on port 9000, allowing NGINX to forward PHP requests to this port.
# Sets the ownership of the listening socket to the www-data user and group, ensuring proper permissions for socket communication.
# Implements a dynamic process manager with the following settings:
	# Maximum of 5 child processes to handle incoming PHP requests.
	# Starts with 2 servers at startup to handle initial load.
	# Maintains a minimum of 1 spare server to handle sudden increases in load.
	# Allows a maximum of 3 spare servers to handle peak load.
# Preserves environment variables for PHP-FPM processes, ensuring that necessary variables are available during execution.
# Optimized for typical WordPress workloads, providing a balance between performance and resource usage.