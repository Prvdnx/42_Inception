server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ookamonu.42.fr www.ookamonu.42.fr;
    ssl_certificate        /etc/ssl/cert.cert;
    ssl_certificate_key    /etc/ssl/key.key;
    ssl_protocols          TLSv1.2 TLSv1.3;
    root /var/www/wordpress;
    index index.php;

   location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}



# Configures NGINX to listen on port 443 for both IPv4 and IPv6 connections, enabling secure HTTPS traffic.
# Sets the server name for domain routing, allowing NGINX to respond to requests for the specified domain names.
# Specifies the paths to the SSL certificate and key files, enabling encrypted connections.
# Configures the SSL protocols to use TLSv1.2 and TLSv1.3 only, providing strong security for HTTPS connections.
# Sets the document root to the WordPress directory, specifying where the website files are located.
# Sets the default index file to index.php, allowing NGINX to serve the WordPress homepage.
# Configures PHP processing for files with a .php extension:
	# Splits the URI for proper PHP handling, separating the script name from the path info.
	# Forwards PHP requests to the WordPress container on port 9000, where PHP-FPM is running.
	# Sets the default index file for FastCGI to index.php.
	# Includes the standard FastCGI parameters for proper PHP execution.
	# Sets the SCRIPT_FILENAME parameter to the full path of the PHP script.
	# Sets the PATH_INFO parameter to the additional path information for the PHP script.