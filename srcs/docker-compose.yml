        # Configures the container to always restart, ensuring high availability.
        # Uses the 'mariadb' image for the container.
        # Mounts a named volume for persistent data storage at /var/lib/mysql.
        # Loads environment variables from the .env file for database configuration.
        # Connects the container to the 'ookamonu' network for inter-container communication.
    # nginx:
        # Builds the NGINX image from the specified Dockerfile in the requirements/nginx/ directory.
        # Sets the container name to 'nginx' for easy identification.
        # Uses the 'nginx' image for the container.
        # Exposes port 443 for HTTPS traffic, enabling secure connections to the web server.
        # Configures the container to always restart, ensuring high availability.
        # Loads environment variables from the .env file for web server configuration.
        # Connects the container to the 'ookamonu' network for inter-container communication.
        # Specifies that the 'nginx' service depends on the 'wordpress' service, ensuring that WordPress is up and running before NGINX starts.
        # Mounts a named volume for web files at /var/www/.
    # wordpress:
        # Builds the WordPress image from the specified Dockerfile in the requirements/wordpress/ directory.
