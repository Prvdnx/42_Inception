version: '3'

services:
  mariadb:
    build: requirements/mariadb/
    container_name: mariadb
    restart: always
    image: mariadb
    volumes: [mariadb:/var/lib/mysql]
    env_file: [.env]
    networks: [ookamonu]

  nginx:
    build: requirements/nginx/
    container_name: nginx
    image: nginx
    ports: [443:443]
    restart: always
    env_file: [.env]
    networks: [ookamonu]
    depends_on: [wordpress]
    volumes: [wordpress:/var/www/]

  wordpress:
    build: requirements/wordpress/
    container_name: wordpress
    image: wordpress
    restart: always
    volumes: [wordpress:/var/www]
    env_file: [.env]
    networks: [ookamonu]
    depends_on: [mariadb]

volumes:
  mariadb: { name: mariadb, driver: local, driver_opts: {type: none, o: bind, device: ~/ookamonu/data/mariadb_data} }
  wordpress: { name: wordpress, driver: local, driver_opts: {type: none, o: bind, device: ~/ookamonu/data/wordpress_data} }

networks: { ookamonu: { driver: bridge } }




# Defines the Docker Compose configuration for the project, specifying the services, volumes, and networks.
