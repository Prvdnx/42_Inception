version: '3.8'

services:
  nginx-42:
    build: ./requirements/nginx
    image: nginx-42
    container_name: nginx-42
    ports: [ "443:443" ]
    depends_on: [ "wordpress-site" ]
    volumes: [ "wordvol:/var/www/html" ]
    networks: [ "inception" ]
    restart: always

  mariadb-data:
    build: ./requirements/mariadb
    image: mariadb-data
    container_name: mariadb-data
    env_file: [ ".env" ]
    volumes: [ "mariavol:/var/lib/mysql" ]
    networks: [ "inception" ]
    restart: always
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "--silent" ]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 5s
  
  wordpress-site:
    build: ./requirements/wordpress
    image: wordpress-site
    container_name: wordpress-site
    env_file: [ ".env" ]
    depends_on:
      mariadb-data:
        condition: service_healthy
    volumes: [ "wordvol:/var/www/html" ]
    networks: [ "inception" ]
    restart: always

volumes:
  mariavol: { name: mariavol, driver_opts: { type: none, device: /home/ookamonu/data/mariadb_data, o: bind } }
  wordvol: { name: wordvol, driver_opts: { type: none, device: /home/ookamonu/data/wordpress_data, o: bind } }

networks:
  inception: { name: inception }





### this docker-compose.yml file defines the services for the application:
# - nginx-42: builds and runs the nginx server container, exposing port 443 for HTTPS
    # connections, and depends on the WordPress site service.

# - mariadb-data: builds and runs the MariaDB server container, using environment
    # variables from the .env file, and includes a health check.

# - wordpress-site: builds and runs the WordPress site container, using environment
    # variables from the .env file, and depends on the MariaDB service being healthy.

# - defines volumes for persistent storage of MariaDB and WordPress data.

# - defines a custom network for the services to communicate.
